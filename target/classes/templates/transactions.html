<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - SecureBank</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <h3 class="mb-4">📜 Transaction History</h3>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Sender Account</th>
                        <th>Receiver Account</th>
                        <th>Date &amp; Time</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="7" class="text-center text-muted">No transactions yet.</td>
                    </tr>
                    <tr th:each="tx : ${transactions}">
                        <td th:text="${tx.id}">1</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${(tx.transactionType.name() == 'DEPOSIT' or tx.transactionType.name() == 'TRANSFER_RECEIVED' or (tx.transactionType.name() == 'TRANSFER_SENT' and tx.receiverAccount.accountNumber == currentAccountNumber))} ? 'bg-success' : (${tx.transactionType.name() == 'WITHDRAWAL'} ? 'bg-warning text-dark' : 'bg-primary')"
                                  th:text="${tx.transactionType.name() == 'TRANSFER_SENT' and tx.receiverAccount.accountNumber == currentAccountNumber ? 'TRANSFER_RECEIVED' : tx.transactionType}">DEPOSIT</span>
                        </td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(tx.amount, 1, 2)}">₹0.00</td>
                        <td th:text="${tx.senderAccount != null ? tx.senderAccount.accountNumber : '—'}">—</td>
                        <td th:text="${tx.receiverAccount != null ? tx.receiverAccount.accountNumber : '—'}">—</td>
                        <td th:text="${#temporals.format(tx.transactionDate, 'dd MMM yyyy, hh:mm a')}">Date</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${tx.status.name() == 'SUCCESS'} ? 'bg-success' : (${tx.status.name() == 'FAILED'} ? 'bg-danger' : 'bg-secondary')"
                                  th:text="${tx.status}">SUCCESS</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
