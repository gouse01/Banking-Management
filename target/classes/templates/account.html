<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details - SecureBank</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <h3 class="mb-4">Account Details</h3>

    <div class="card shadow-sm" style="max-width: 500px;">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-5">Account Number</dt>
                <dd class="col-sm-7" th:text="${account.accountNumber}">0000000000</dd>

                <dt class="col-sm-5">Account Holder</dt>
                <dd class="col-sm-7" th:text="${account.accountHolderName}">John Doe</dd>

                <dt class="col-sm-5">Account Type</dt>
                <dd class="col-sm-7" th:text="${account.accountType}">SAVINGS</dd>

                <dt class="col-sm-5">Current Balance</dt>
                <dd class="col-sm-7 fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(account.balance, 1, 2)}">₹0.00</dd>
            </dl>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
