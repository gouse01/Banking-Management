# =========================
# Server Configuration
# =========================
server.port=8082

# =========================
# MySQL Datasource Configuration
# (Override these via environment variables in production:
#  DB_URL, DB_USERNAME, DB_PASSWORD)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/banking?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=gouse
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================
# Thymeleaf Configuration
# =========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.com.bank=DEBUG
