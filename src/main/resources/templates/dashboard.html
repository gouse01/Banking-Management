<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SecureBank</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">
    <h3 class="mb-4">Welcome back, <span th:text="${account.accountHolderName}">User</span> 👋</h3>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm balance-card">
                <div class="card-body">
                    <h6 class="text-uppercase text-muted mb-1">Account Number</h6>
                    <p class="fs-5 fw-semibold mb-3" th:text="${account.accountNumber}">0000000000</p>
                    <h6 class="text-uppercase text-muted mb-1">Current Balance</h6>
                    <p class="display-6 fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(account.balance, 1, 2)}">₹0.00</p>
                    <span class="badge bg-secondary" th:text="${account.accountType}">SAVINGS</span>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-uppercase text-muted mb-3">Quick Actions</h6>
                    <div class="d-grid gap-2">
                        <a th:href="@{/deposit}" class="btn btn-success">➕ Deposit</a>
                        <a th:href="@{/withdraw}" class="btn btn-warning">➖ Withdraw</a>
                        <a th:href="@{/transfer}" class="btn btn-primary">🔁 Transfer</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="text-uppercase text-muted mb-0">Recent Transactions</h6>
                <a th:href="@{/transactions}" class="small">View all →</a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(recentTransactions)}">
                        <td colspan="4" class="text-center text-muted">No transactions yet.</td>
                    </tr>
                    <tr th:each="tx : ${recentTransactions}">
                        <td th:text="${tx.transactionType.name() == 'TRANSFER_SENT' and tx.receiverAccount.accountNumber == currentAccountNumber ? 'TRANSFER_RECEIVED' : tx.transactionType}">DEPOSIT</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(tx.amount, 1, 2)}">₹0.00</td>
                        <td th:text="${#temporals.format(tx.transactionDate, 'dd MMM yyyy, hh:mm a')}">Date</td>
                        <td><span class="badge bg-success" th:text="${tx.status}">SUCCESS</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
